version: 2

sources:
  - name: raw
    schema: gz_raw_data
    description: "Greenweez ham veri tabloları"
    tables:
      - name: orders
        identifier: raw_gz_orders
        description: "Ham sipariş verileri"
      - name: sales
        identifier: raw_gz_sales
        description: "Ham satış verileri"
        columns:
          - name: date_date
            description: "Satış tarihi"
          - name: orders_id
            description: "Sipariş ID'si"
          - name: pdt_id
            description: "Ürün ID'si"
          - name: revenue
            description: "Gelir"
          - name: quantity
            description: "Satış adedi"
      - name: product
        identifier: raw_gz_product
        description: "Ham ürün verileri"
        columns:
          - name: products_id
            description: "Ürün ID'si"
          - name: purchSE_PRICE
            description: "Satın alma fiyatı"
      - name: ship
        identifier: raw_gz_ship
        description: "Ham kargo verileri"
        columns:
          - name: orders_id
            description: "Sipariş ID'si"
          - name: shipping_fee
            description: "Kargo ücreti"
          - name: ship_cost
            description: "Kargo maliyeti"
          - name: logCost
            description: "Lojistik maliyeti"