version: 2

sources:
  - name: gz_raw_data
    description: "Greenweez ham veri kümesi"
    tables:
      # =========================================================
      # 1. ADWORDS
      # =========================================================
      - name: adwords
        identifier: raw_gz_adwords
        description: "Google Adwords reklam performans verileri"
        tests:
          - unique:
              column_name: "CONCAT(date_date, campaign_key)"
          - not_null:
              column_name: "CONCAT(date_date, campaign_key)"
        columns:
          - name: date_date
            description: "Reklamın yayınlandığı tarih"
          - name: paid_source
            description: "Reklam kaynağı (Google)"
          - name: campaign_key
            description: "Kampanya benzersiz anahtarı"
          - name: camPGN_name
            description: "Kampanya adı"
          - name: ads_cost
            description: "Reklam maliyeti"
          - name: impression
            description: "Reklam gösterim sayısı"
          - name: click
            description: "Reklam tıklama sayısı"

